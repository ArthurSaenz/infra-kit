packages:
  - apps/*/*
  - packages/*
  - vendor/packages/*
  - vendor/configs/*
  - '!**/test/**'

# pnpm 11 defaults catalogMode to auto-rewriting matching deps to `catalog:` on install.
# Keep it manual so package versions stay explicit where we want them (e.g. the published
# infra-kit CLI, which must ship real version ranges, not `catalog:` specifiers).
catalogMode: manual

catalog:
  '@aws-lambda-powertools/logger': ^2.35.0
  '@inquirer/checkbox': ^5.2.5
  '@inquirer/confirm': ^6.3.2
  '@inquirer/input': ^5.1.6
  '@inquirer/password': ^5.2.2
  '@inquirer/select': ^5.2.5
  '@modelcontextprotocol/client': ^2.0.0
  '@modelcontextprotocol/sdk': ^1.30.0
  '@modelcontextprotocol/server': ^2.0.0
  '@playwright/test': ^1.59.1
  '@slip-stream-kit/config': ^0.5.0
  '@tailwindcss/vite': ^4.2.2

  '@tanstack/react-router': ^1.168.10
  '@tanstack/router-devtools': ^1.166.11
  '@tanstack/router-plugin': ^1.167.12
  '@tanstack/router-vite-plugin': 1.166.27
  '@types/aws-lambda': ^8.10.163
  '@types/node': ^26.5.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.0.2
  '@vitest/browser': ^5.0.0
  '@vitest/browser-playwright': ^5.0.0
  '@vitest/coverage-v8': ^5.0.0
  '@vitest/ui': ^5.0.0
  chalk: ^6.0.0
  chokidar: ^5.0.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  commander: ^15.0.0
  date-fns: ^4.1.0
  esbuild: ^0.28.2
  fastify: 5.12.1
  ink: ^7.1.1
  ink-testing-library: ^4.0.0

  jotai: 3.0.0
  lucide-react: ^1.17.0
  pino: ^10.3.1
  pino-pretty: ^13.1.3
  playwright: ^1.60.0
  portless: ^0.15.1
  # react and react-dom must be the EXACT same version — react-dom throws
  # "Incompatible React versions" at runtime otherwise, which is how this surfaced
  # (@wl/web-toolkit's test suite failed to import at all).
  react: 19.3.0
  react-dom: 19.3.0
  rollup-plugin-visualizer: ^7.0.0
  sass-embedded: ^1.99.0
  tailwind-merge: ^3.6.0

  tailwindcss: ^4.2.2
  tw-animate-css: ^1.4.0

  typescript: ^6.0.3
  typescript-plugin-css-modules: ^5.2.0

  vite: 8.3.0
  vite-plugin-dts: ^5.1.0
  vitest: ^5.0.0
  vitest-browser-react: ^2.3.0
  vite-tsconfig-paths: ^6.1.1
  yaml: ^2.9.1
  zod: ^4.3.6
  zx: ^8.8.5

enableGlobalVirtualStore: true

# Storybook 10 dynamically `import()`s the framework + addons by name from its own dist code.
# Under enableGlobalVirtualStore, storybook's realpath sits outside the project tree, so the
# walk-up never reaches the project root and these can't be resolved. Listing them as optional
# peers makes pnpm symlink them as siblings of storybook in its virtual-store node_modules.
packageExtensions:
  storybook:
    peerDependencies:
      '@storybook/react-vite': '*'
      '@storybook/addon-docs': '*'
      '@storybook/addon-links': '*'
    peerDependenciesMeta:
      '@storybook/react-vite': { optional: true }
      '@storybook/addon-docs': { optional: true }
      '@storybook/addon-links': { optional: true }

supportedArchitectures:
  cpu:
    - arm64
  libc:
    - glibc
  os:
    - darwin
    - linux

strictPeerDependencies: false

# Pin TanStack to the set vendored @wl/docs-ui (react-start 1.168.9) type-checks against; a fresh
# install otherwise drifts to react-router 1.170.7 / router-core 1.171.5 (fumadocs-core peer range)
# and breaks ts-check. Matches the versions the other consumer repos resolve.
overrides:
  '@tanstack/react-router': 1.170.6
  '@tanstack/router-core': 1.171.4

publicHoistPattern:
  - '*types*'
  - '*eslint*'
  - '*prettier*'
  - '*stylelint*'
  - '*typescript*'
  - '*config*'
  - '@storybook*'
  - storybook*
  - '*@testing-library*'
  - '*@vitejs*'
  - '*vitest*'
  - '*@vitest*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: true

minimumReleaseAgeExclude:
  - '@slip-stream-kit/*'
  - infra-kit
  - portless@0.15.2
catalogs:
  conflicts_zod_h4_4_3:
    zod: ^4.4.3
  conflicts_esbuild_h0_28_1:
    esbuild: ^0.28.1
  conflicts_portless_h0_15_2:
    portless: ^0.15.2
  conflicts_fastify_h5_12_3:
    fastify: ^5.12.3
  conflicts_conflicts_portless_h0_15_2_h0_15_6:
    portless: ^0.15.6
  conflicts_conflicts_zod_h4_4_3_h4_5_4:
    zod: ^4.5.4
  conflicts_conflicts_esbuild_h0_28_1_h0_28_2:
    esbuild: ^0.28.2
  conflicts_@slip-stream-kit/config_h0_9_0:
    '@slip-stream-kit/config': ^0.9.0
  conflicts_conflicts_fastify_h5_12_3_h5_12_4:
    fastify: ^5.12.4
  conflicts_conflicts_zod_h4_4_3_h4_6_2:
    zod: ^4.6.2
