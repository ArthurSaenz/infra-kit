# Shared deploy job for consumer monorepos (hulyo, travelist): one service, one environment, by
# `infra-kit deploy-run <service>`, which runs the service's deploy.ts or its devops/scripts .sh. It takes
# over from each repo's `_deploy-serverless-jobs.yml`.
#
# Called cross-org, so `secrets: inherit` is unavailable and every secret is passed explicitly:
# https://docs.github.com/en/actions/sharing-automations/reusing-workflows#passing-secrets-to-nested-workflows
# Callers pin this file by commit SHA.
name: ik-deploy-service

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      ref:
        description: 'The dispatched branch, as the build reports it (VITE_BRANCH_NAME)'
        required: true
        type: string
      sha:
        description: 'The commit to check out. Pass github.sha so every service through this job builds the dispatched commit even if the branch moves; omitted = the tip of ref'
        required: false
        type: string
        default: ''
      service:
        description: 'The service as infra-kit.deploy.ts names it'
        required: true
        type: string
      runner:
        required: false
        type: string
        default: ubuntu-24.04-arm
      infra-kit-version:
        description: 'The infra-kit that generated the caller (`deploy-sync`), so a branch deploys with the toolkit it was generated by'
        required: true
        type: string
      timeout-minutes:
        description: 'A timed-out step fails and keeps its logs; a cancelled job loses them'
        required: false
        type: number
        default: 25
    secrets:
      aws-access-key-id:
        required: true
      aws-secret-access-key:
        required: true
      aws-region:
        required: true
      serverless-access-key:
        required: false
      slack-token:
        required: false
      slack-channel:
        required: false
      extra-env:
        description: 'KEY=VALUE lines exported to the deploy step (repo-specific secrets such as MONITORING_IP)'
        required: false

permissions: {}

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # The build contract the scripts never set themselves: without VITE_DOMAIN_ENV the UIs fall back
      # to the prod domain.
      VITE_DOMAIN_ENV: ${{ inputs.environment }}
      VITE_BRANCH_NAME: ${{ inputs.ref }}
      VITE_COMMIT_HASH: ${{ inputs.sha != '' && inputs.sha || github.sha }}
      SLACK_ENABLED: ${{ secrets.slack-token != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || inputs.ref }}
          persist-credentials: false

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ secrets.aws-region }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install infra-kit
        run: pnpm add -g "infra-kit@${INFRA_KIT_VERSION}"
        env:
          INFRA_KIT_VERSION: ${{ inputs.infra-kit-version }}

      - name: Deploy application
        timeout-minutes: ${{ inputs.timeout-minutes }}
        run: infra-kit deploy-run "$SERVICE"
        env:
          SERVICE: ${{ inputs.service }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.serverless-access-key }}
          INFRA_KIT_EXTRA_ENV: ${{ secrets.extra-env }}

      - name: Notify on failure
        if: failure() && env.SLACK_ENABLED == 'true'
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: '[deploy-v2] Deploy failed for ${{ inputs.service }} to ${{ inputs.environment }} - ${{ github.ref_name }} by ${{ github.actor }}'
          SLACK_CHANNEL: ${{ secrets.slack-channel }}
          SLACK_TOKEN: ${{ secrets.slack-token }}
