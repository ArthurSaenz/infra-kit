# Releases the four infra-kit packages from main. A push that moves a package version stages every
# version that is not on the registry yet; a human then approves each package on npmjs.com
# (Staged Packages) or with `npm stage approve`. That 2FA step is what a hijacked CI cannot fake,
# and the trusted publisher on npmjs.com allows only `npm stage publish` from this file.
# Shape follows https://evilmartians.com/chronicles/the-secure-way-to-release-an-npm-package:
# build and publish are separate jobs, only publish has `id-token: write`, publish installs nothing.
name: Release
on:
  push:
    branches: ['main']
    paths:
      - 'apps/infra-kit/cli/package.json'
      - 'apps/infra-kit/config/package.json'
      - 'apps/infra-kit/eslint-plugin/package.json'
      - 'apps/infra-kit/vite/package.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, pack and verify the tarballs, then `npm publish --dry-run` — nothing is staged'
        type: boolean
        default: true
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false # no cache on the release path (cache poisoning)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and pack the release tarballs
        run: node scripts/pack-release.mjs
      - name: Upload release tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: release-artifacts/
          retention-days: 1
          if-no-files-found: error

  publish: # the critical job: no dependencies installed, no cache, only pinned first-party actions
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write # trusted publishing — there is no npm token anywhere in this repo
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: release-artifacts/
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Stage the release on npm
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/publish-release.mjs
