# One `pnpm install` before a deploy run fans out, the v2 counterpart of the consumers'
# `_cache-nodemodules-jobs.yml`. It fills the pnpm store cache that every ik-deploy-service job then
# restores, and a broken lockfile fails here once instead of in every service job.
#
# Called cross-org like ik-deploy-service.yml, pinned by the same commit SHA.
name: ik-install-deps

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      sha:
        description: 'The commit to check out; omitted = the tip of ref'
        required: false
        type: string
        default: ''
      runner:
        description: 'Must match the deploy jobs: the setup-node cache key includes the OS and architecture'
        required: false
        type: string
        default: ubuntu-24.04-arm
    secrets:
      slack-token:
        required: false
      slack-channel:
        required: false

permissions: {}

jobs:
  install:
    name: Install dependencies
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    env:
      SLACK_ENABLED: ${{ secrets.slack-token != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || inputs.ref }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Notify on failure
        if: failure() && env.SLACK_ENABLED == 'true'
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: '[deploy-v2] Install failed, no service deployed - ${{ github.ref_name }} by ${{ github.actor }}'
          SLACK_CHANNEL: ${{ secrets.slack-channel }}
          SLACK_TOKEN: ${{ secrets.slack-token }}
