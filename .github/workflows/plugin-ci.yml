name: plugin-ci

# Gates for the Claude Code plugin at plugins/infra-kit (plan §8.1 U1, U9; §8.1 U13 reported only).
on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin-ci.yml'
      - '.github/fixtures/unknown-frontmatter-plugin/**'
      - 'scripts/check-plugin-version-bump.mjs'
      - 'scripts/report-published-cli-skew.mjs'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: U1 — plugin manifest and skills validate under --strict
        run: claude plugin validate ./plugins/infra-kit --strict --json
      - name: Marketplace catalog validates under --strict
        run: claude plugin validate . --strict --json
      - name: Manifest guard suite (U2–U8, U12–U19, T1, T5) and the skew-report seam
        run: node --test 'plugins/infra-kit/__tests__/*.test.mjs'
      - name: Relocated skill tests (U11)
        run: node --test --test-concurrency=1 'plugins/infra-kit/skills/*/__tests__/*.test.mjs'
      - name: U9 — a plugin change must bump plugin.json version
        if: github.event_name == 'pull_request'
        run: node scripts/check-plugin-version-bump.mjs "origin/${{ github.base_ref }}"
      # Reports, never gates. The plugin is live on merge and the CLI on publish, so a skill can name a
      # tool — or lean on `env-load` accepting a missing `config` — that the build a user installs does
      # not have yet. Each skill's floor sentence and fallback clause are what make that window
      # survivable; this step makes it VISIBLE on the PR (via the step summary) without reddening
      # unrelated plugin PRs the way the gate it replaced did.
      #
      # NOTE: the manifest suite above defines a test named U13'. It is unrelated to the "U13" probe
      # step below, which comes from a different plan's numbering.
      - name: Published CLI skew report (reported, never gating)
        continue-on-error: true
        run: node scripts/report-published-cli-skew.mjs
      - name: U13 — does --strict object to unknown frontmatter? (reported, never gating)
        continue-on-error: true
        run: |
          echo "U13 probe: OMC-runtime frontmatter (pipeline/next-skill/aliases) under --strict"
          claude plugin validate ./.github/fixtures/unknown-frontmatter-plugin --strict --json || echo "U13: strict mode objected (see above)"
