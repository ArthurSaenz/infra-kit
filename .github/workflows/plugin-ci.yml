name: plugin-ci

# Gates for the Claude Code plugin at plugins/infra-kit (plan §8.1 U1, U9; §8.1 U13 reported only).
on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin-ci.yml'
      - '.github/fixtures/unknown-frontmatter-plugin/**'
      - 'scripts/check-plugin-version-bump.mjs'
      - 'scripts/check-workflow-resource-published.mjs'
      # The bodies the commands defer to. A command names a resource it does not contain, so editing
      # the resource — renaming it, or dropping the `?raw` import that inlines it — breaks the
      # command without touching `plugins/**`, and the gate would not have run.
      - 'apps/infra-kit/cli/resources/workflow/**'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'apps/infra-kit/cli/resources/workflow/**'

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: U1 — plugin manifest and skills validate under --strict
        run: claude plugin validate ./plugins/infra-kit --strict --json
      - name: Marketplace catalog validates under --strict
        run: claude plugin validate . --strict --json
      - name: Manifest guard suite (U2–U8, U12, U13, U14, T1, T1b, T5)
        run: node --test 'plugins/infra-kit/__tests__/*.test.mjs'
      - name: Relocated skill tests (U11)
        run: node --test --test-concurrency=1 'plugins/infra-kit/skills/*/__tests__/*.test.mjs'
      - name: U9 — a plugin change must bump plugin.json version
        if: github.event_name == 'pull_request'
        run: node scripts/check-plugin-version-bump.mjs "origin/${{ github.base_ref }}"
      # PM-C part 3 — the only mechanism enforcing "the command must not ship before the CLI that
      # serves the resource it reads". The command body's fallback line and version floor make the
      # residual window survivable; this is what stops the window opening. It is EXPECTED to be red
      # between merging the command and publishing that CLI — that redness is the feature.
      #
      # NOTE: the manifest suite above also defines tests named U13/U14/T1b. They are unrelated to
      # the "U13" probe step below, which comes from a different plan's numbering. Two live U13s.
      - name: PM-C — the published CLI serves infra-kit://workflow/release-create
        run: node scripts/check-workflow-resource-published.mjs
      - name: U13 — does --strict object to unknown frontmatter? (reported, never gating)
        continue-on-error: true
        run: |
          echo "U13 probe: OMC-runtime frontmatter (pipeline/next-skill/aliases) under --strict"
          claude plugin validate ./.github/fixtures/unknown-frontmatter-plugin --strict --json || echo "U13: strict mode objected (see above)"
