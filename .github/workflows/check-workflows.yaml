# Lints every workflow with zizmor on each change. Whoever can change a workflow can release the
# npm packages, so a workflow mistake (pull_request_target, template injection, an unpinned action)
# is a publishing hole; see https://evilmartians.com/chronicles/the-secure-way-to-release-an-npm-package
name: Lint CI workflows
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
