# Lints every workflow with zizmor on each change. Whoever can change a workflow can release the
# npm packages, so a workflow mistake (pull_request_target, template injection, an unpinned action)
# is a publishing hole; see https://evilmartians.com/chronicles/the-secure-way-to-release-an-npm-package
name: Lint CI workflows
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
